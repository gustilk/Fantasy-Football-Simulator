kind = "web"
previewPath = "/"
title = "Gridiron Sim"
description = "A reusable NFL fantasy matchup simulator. Choose teams, set weather and player context, and generate fresh drive-by-drive game simulations with Half-PPR player projections."
version = "1.0.0"
id = "artifacts/gridiron-sim"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21697

[services.development]
run = "pnpm --filter @workspace/gridiron-sim run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gridiron-sim", "run", "build" ]
serve = "static"
publicDir = "artifacts/gridiron-sim/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21697"
BASE_PATH = "/"
