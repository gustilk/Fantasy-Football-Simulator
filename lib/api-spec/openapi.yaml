openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /nfl-schedule/{season}:
    get:
      operationId: getNflSchedule
      summary: Upcoming announced NFL matchups for all teams in a season
      parameters:
        - in: path
          name: season
          required: true
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - in: query
          name: scope
          description: Upcoming games by default; all includes started and completed games for weekly simulations.
          schema: { type: string, enum: [upcoming, all] }
      responses:
        "200":
          description: Public schedule with confirmed home and away teams
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NflSchedule" }
        "400":
          description: Invalid season
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonError" }
        "502":
          description: Public source unavailable or incomplete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonError" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /season-teams:
    get:
      operationId: listSeasonTeams
      summary: List saved team rosters and weekly history for a season
      parameters:
        - in: query
          name: season
          required: true
          schema: { type: integer, minimum: 2000, maximum: 2100 }
      responses:
        "200":
          description: Saved teams
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TeamSeasonRecord" }
        "400":
          description: Invalid season
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonError" }
  /season-teams/{season}/{team}:
    put:
      operationId: saveSeasonTeam
      summary: Save a complete team roster and history with optimistic concurrency
      parameters:
        - in: path
          name: season
          required: true
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - in: path
          name: team
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamSeasonInput" }
      responses:
        "200":
          description: Saved team with current version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamSeasonRecord" }
        "400":
          description: Invalid roster or weekly statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonError" }
        "409":
          description: Another session changed this team; reload before saving
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonError" }
  /nfl-import/{season}/{team}:
    post:
      operationId: previewNflTeam
      summary: Fetch ESPN roster and completed regular-season history without saving
      parameters:
        - in: path
          name: season
          required: true
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - in: path
          name: team
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - in: query
          name: gameLimit
          schema: { type: integer, minimum: 1, maximum: 17, default: 17 }
      responses:
        "200":
          description: Read-only import preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NflImportPreview" }
        "400":
          description: Invalid season or NFL team
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonError" }
        "502":
          description: Source unavailable or incomplete; nothing was saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonError" }
        "429":
          description: Too many simultaneous imports
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonError" }
  /nfl-depth-chart/{season}/{team}:
    get:
      operationId: getNflDepthChart
      summary: Read current ESPN offensive depth-chart roles without changing saved teams
      parameters:
        - in: path
          name: season
          required: true
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - in: path
          name: team
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200":
          description: Season-validated current depth chart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NflDepthChart" }
        "400":
          description: Invalid team or season
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonError" }
        "502":
          description: Depth chart unavailable or wrong season
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonError" }
components:
  schemas:
    NflScheduledGame:
      type: object
      required: [id, awayTeam, homeTeam, date, timeConfirmed, week, seasonType]
      properties:
        id: { type: string }
        awayTeam: { type: string }
        homeTeam: { type: string }
        date: { type: string }
        timeConfirmed: { type: boolean }
        week: { type: integer, minimum: 1, maximum: 22 }
        seasonType: { type: string, enum: [regular, postseason] }
        odds: { $ref: "#/components/schemas/NflMarketQuote" }
    NflMarketQuote:
      type: object
      required: [homeSpread, total, provider]
      properties:
        homeSpread: { type: number }
        total: { type: number }
        provider: { type: string }
    NflSchedule:
      type: object
      required: [season, fetchedAt, sourceUrl, games, unannouncedGames]
      properties:
        season: { type: integer }
        fetchedAt: { type: string }
        sourceUrl: { type: string }
        unannouncedGames: { type: integer }
        games:
          type: array
          items: { $ref: "#/components/schemas/NflScheduledGame" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    NumericStats:
      type: object
      additionalProperties:
        type: number
        minimum: -1000
        maximum: 10000
    RosterPlayer:
      type: object
      required: [id, name, position, side, active]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 100 }
        position: { type: string, enum: [QB, RB, WR, TE, K, OL, DL, EDGE, LB, CB, S, OTHER] }
        side: { type: string, enum: [offense, defense] }
        active: { type: boolean }
        elite1x:
          type: boolean
          description: Legacy elite preference. Used only when eliteTier is omitted; false disables defaults and true enables the approved default tier or 1x.
        eliteTier:
          type: integer
          enum: [0, 1, 2, 3]
          description: Optional manual opportunity tier. 0 disables, 1 gives 20%, 2 gives 40%, and 3 gives 60% higher target/carry priority. QB rushing only. Omitted uses legacy preferences or approved name-and-position defaults.
        defensiveTier:
          type: integer
          enum: [0, 1, 2]
          description: Defensive event priority for defense-side DL/EDGE/LB/CB/S players. 0 disables, 1 adds 20%, 2 adds 40% to role-appropriate opportunity weights. Omitted uses approved defender defaults. Never overrides availability or multiplies fantasy points.
        source: { $ref: "#/components/schemas/NflDataSource" }
        sourcePosition: { type: string }
        availability: { type: string }
        availabilityReport: { $ref: "#/components/schemas/PlayerAvailabilityReport" }
        availabilityOverride: { $ref: "#/components/schemas/PlayerAvailabilityOverride" }
        depthRank: { type: integer, minimum: 1, maximum: 50 }
        depthSource: { $ref: "#/components/schemas/NflDataSource" }
    PlayerAvailabilityReport:
      type: object
      required: [status, rosterActive, source]
      properties:
        status: { type: string, enum: [available, out, questionable, doubtful, limited, unknown] }
        rosterActive: { type: boolean }
        source: { $ref: "#/components/schemas/NflDataSource" }
    PlayerAvailabilityOverride:
      type: object
      required: [week, status, updatedAt]
      properties:
        week: { type: integer, minimum: 1, maximum: 18 }
        status: { type: string, enum: [available, out, questionable, doubtful, limited] }
        updatedAt: { type: string, format: date-time }
    NflDepthRole:
      type: object
      required: [athleteId, position, depthRank]
      properties:
        athleteId: { type: string }
        position: { type: string, enum: [QB, RB, WR, TE] }
        depthRank: { type: integer, minimum: 1, maximum: 50 }
    NflDepthChart:
      type: object
      required: [season, team, source, roles]
      properties:
        season: { type: integer }
        team: { type: string }
        source: { $ref: "#/components/schemas/NflDataSource" }
        roles:
          type: array
          items: { $ref: "#/components/schemas/NflDepthRole" }
    TeamWeek:
      type: object
      required: [week, status, opponent, venue, result, teamScore, opponentScore, teamDefense, playerStats]
      properties:
        week: { type: integer, minimum: 1, maximum: 18 }
        status: { type: string, enum: [played, bye, upcoming] }
        opponent: { type: string, maxLength: 100 }
        venue: { type: string, enum: [home, away] }
        result: { type: string, enum: [W, L, T, none] }
        teamScore: { type: [number, "null"], minimum: 0, maximum: 100 }
        opponentScore: { type: [number, "null"], minimum: 0, maximum: 100 }
        teamDefense: { $ref: "#/components/schemas/NumericStats" }
        playerStats:
          type: object
          additionalProperties: { $ref: "#/components/schemas/NumericStats" }
        source: { $ref: "#/components/schemas/NflDataSource" }
    TeamSeasonInput:
      type: object
      required: [expectedVersion, players, weeks]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        defenseTier:
          type: [integer, "null"]
          enum: [0, 1, null]
          description: Team defensive priority. 0 disables, 1 adds 20%; null uses approved team defaults. An omitted update preserves the saved preference.
        players:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/RosterPlayer" }
        weeks:
          type: array
          maxItems: 18
          items: { $ref: "#/components/schemas/TeamWeek" }
    TeamSeasonRecord:
      type: object
      required: [season, team, version, players, weeks]
      properties:
        season: { type: integer }
        team: { type: string }
        version: { type: integer }
        defenseTier:
          type: [integer, "null"]
          enum: [0, 1, null]
        players:
          type: array
          items: { $ref: "#/components/schemas/RosterPlayer" }
        weeks:
          type: array
          items: { $ref: "#/components/schemas/TeamWeek" }
    SeasonError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    NflDataSource:
      type: object
      required: [provider, url, fetchedAt]
      properties:
        provider: { type: string, enum: [ESPN] }
        url: { type: string, format: uri }
        fetchedAt: { type: string, format: date-time }
        athleteId: { type: string }
        eventId: { type: string }
    NflImportPreview:
      type: object
      required: [season, team, fetchedAt, rosterUrl, players, weeks, warnings]
      properties:
        season: { type: integer }
        team: { type: string }
        fetchedAt: { type: string, format: date-time }
        rosterUrl: { type: string, format: uri }
        players:
          type: array
          items: { $ref: "#/components/schemas/RosterPlayer" }
        weeks:
          type: array
          items: { $ref: "#/components/schemas/TeamWeek" }
        warnings:
          type: array
          items: { type: string }

