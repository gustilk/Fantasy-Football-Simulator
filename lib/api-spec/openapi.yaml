openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /salary-files/{season}/{format}:
    parameters:
      - in: path
        name: season
        required: true
        schema: { type: integer, minimum: 2000, maximum: 2100 }
      - in: path
        name: format
        required: true
        schema: { type: string, enum: [classic, showdown] }
    get:
      operationId: getSharedSalaryFile
      summary: Shared personal-app contest salary data
      responses:
        "200":
          description: Current salary upload or deletion marker
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedSalaryState" }
    put:
      operationId: saveSharedSalaryFile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalaryUploadInput" }
      responses:
        "200":
          description: Saved structured salaries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedSalaryState" }
        "409":
          description: Another device changed this upload; refresh before replacing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonError" }
    delete:
      operationId: deleteSharedSalaryFile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalaryDeletionInput" }
      responses:
        "200":
          description: Deletion marker prevents older browsers restoring removed uploads
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedSalaryState" }
        "409":
          description: Another device changed this upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonError" }
  /nfl-advanced/{season}/{team}/{beforeWeek}:
    get:
      operationId: getNflAdvancedStats
      summary: Verified completed-game advanced NFL reference stats, never forecast multipliers
      parameters:
        - in: path
          name: season
          required: true
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - in: path
          name: team
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - in: path
          name: beforeWeek
          required: true
          schema: { type: integer, minimum: 1, maximum: 19 }
      responses:
        "200":
          description: Reference stats with explicit coverage and source failures
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NflAdvancedReport" }
        "400":
          description: Invalid season, NFL team or cutoff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonError" }
        "502":
          description: Unexpected or inconsistent source data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonError" }
  /nfl-schedule/{season}:
    get:
      operationId: getNflSchedule
      summary: Upcoming announced NFL matchups for all teams in a season
      parameters:
        - in: path
          name: season
          required: true
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - in: query
          name: scope
          description: Upcoming games by default; all includes started and completed games for weekly simulations.
          schema: { type: string, enum: [upcoming, all] }
      responses:
        "200":
          description: Public schedule with confirmed home and away teams
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NflSchedule" }
        "400":
          description: Invalid season
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonError" }
        "502":
          description: Public source unavailable or incomplete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonError" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /season-teams:
    get:
      operationId: listSeasonTeams
      summary: List saved team rosters and weekly history for a season
      parameters:
        - in: query
          name: season
          required: true
          schema: { type: integer, minimum: 2000, maximum: 2100 }
      responses:
        "200":
          description: Saved teams
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TeamSeasonRecord" }
        "400":
          description: Invalid season
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonError" }
  /season-teams/{season}/{team}:
    put:
      operationId: saveSeasonTeam
      summary: Save a complete team roster and history with optimistic concurrency
      parameters:
        - in: path
          name: season
          required: true
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - in: path
          name: team
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamSeasonInput" }
      responses:
        "200":
          description: Saved team with current version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamSeasonRecord" }
        "400":
          description: Invalid roster or weekly statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonError" }
        "409":
          description: Another session changed this team; reload before saving
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonError" }
  /nfl-import/{season}/{team}:
    post:
      operationId: previewNflTeam
      summary: Fetch ESPN roster and completed regular-season history without saving
      parameters:
        - in: path
          name: season
          required: true
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - in: path
          name: team
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - in: query
          name: gameLimit
          schema: { type: integer, minimum: 1, maximum: 17, default: 17 }
      responses:
        "200":
          description: Read-only import preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NflImportPreview" }
        "400":
          description: Invalid season or NFL team
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonError" }
        "502":
          description: Source unavailable or incomplete; nothing was saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonError" }
        "429":
          description: Too many simultaneous imports
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonError" }
  /nfl-depth-chart/{season}/{team}:
    get:
      operationId: getNflDepthChart
      summary: Read current ESPN offensive depth-chart roles without changing saved teams
      parameters:
        - in: path
          name: season
          required: true
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - in: path
          name: team
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200":
          description: Season-validated current depth chart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NflDepthChart" }
        "400":
          description: Invalid team or season
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonError" }
        "502":
          description: Depth chart unavailable or wrong season
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonError" }
components:
  schemas:
    SalaryRow:
      type: object
      required: [id, name, position, team, salary, gameInfo, rosterPosition]
      properties:
        id: { type: string, pattern: '^\d+$', maxLength: 30 }
        name: { type: string, minLength: 1, maxLength: 150 }
        position: { type: string, enum: [QB, RB, WR, TE, K, DST] }
        team: { type: string, minLength: 2, maxLength: 4 }
        salary: { type: integer, minimum: 1, maximum: 50000 }
        gameInfo: { type: string, minLength: 1, maxLength: 300 }
        rosterPosition: { type: string, minLength: 1, maxLength: 30 }
    SalaryUploadInput:
      type: object
      required: [expectedRevision, filename, players]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        filename: { type: string, minLength: 1, maxLength: 255 }
        players:
          type: array
          minItems: 1
          maxItems: 1500
          items: { $ref: "#/components/schemas/SalaryRow" }
    SalaryDeletionInput:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
    SharedSalaryFile:
      type: object
      required: [season, format, filename, importedAt, players]
      properties:
        season: { type: integer }
        format: { type: string, enum: [classic, showdown] }
        filename: { type: string }
        importedAt: { type: string }
        players:
          type: array
          items: { $ref: "#/components/schemas/SalaryRow" }
    SharedSalaryState:
      type: object
      required: [revision, file]
      properties:
        revision: { type: integer }
        file:
          anyOf:
            - { $ref: "#/components/schemas/SharedSalaryFile" }
            - { type: "null" }
    NflAdvancedSource:
      type: object
      required: [kind, url, status, fetchedAt, updatedAt]
      properties:
        kind: { type: string, enum: [play-by-play, snap-counts, player-identities] }
        url: { type: string }
        status: { type: string, enum: [available, unavailable] }
        fetchedAt: { type: ["string", "null"] }
        updatedAt: { type: ["string", "null"] }
        error: { type: string }
    NflAdvancedPlayer:
      type: object
      required: [playerId, sourcePlayerId, name, position, games, snapGames, opportunityGames, offenseSnaps, snapShare, targets, targetShare, carries, carryShare, airYards, airYardsPerTarget, airYardTargets]
      properties:
        playerId: { type: ["string", "null"] }
        sourcePlayerId: { type: string }
        name: { type: string }
        position: { type: string, enum: [QB, RB, WR, TE, unknown] }
        games: { type: integer }
        snapGames: { type: integer }
        opportunityGames: { type: integer }
        offenseSnaps: { type: ["integer", "null"] }
        snapShare: { type: ["number", "null"] }
        targets: { type: ["integer", "null"] }
        targetShare: { type: ["number", "null"] }
        carries: { type: ["integer", "null"] }
        carryShare: { type: ["number", "null"] }
        airYards: { type: ["number", "null"] }
        airYardsPerTarget: { type: ["number", "null"] }
        airYardTargets: { type: integer }
    NflAdvancedDefense:
      type: object
      required: [passPlays, rushPlays, passEpaPlays, rushEpaPlays, passEpaAllowed, rushEpaAllowed, sackHitPlays, sackHitRate, pressureRate, offensePlaysPerGame]
      properties:
        passPlays: { type: integer }
        rushPlays: { type: integer }
        passEpaPlays: { type: integer }
        rushEpaPlays: { type: integer }
        passEpaAllowed: { type: ["number", "null"] }
        rushEpaAllowed: { type: ["number", "null"] }
        sackHitPlays: { type: integer }
        sackHitRate: { type: ["number", "null"] }
        pressureRate: { type: ["number", "null"] }
        offensePlaysPerGame: { type: ["number", "null"] }
    NflAdvancedReport:
      type: object
      required: [season, team, beforeWeek, fetchedAt, status, games, dataThroughWeek, unmatchedPlayers, sources, warnings, players, defense]
      properties:
        season: { type: integer }
        team: { type: string }
        beforeWeek: { type: integer }
        fetchedAt: { type: string }
        status: { type: string, enum: [available, partial, unavailable] }
        games: { type: integer }
        dataThroughWeek: { type: ["integer", "null"] }
        unmatchedPlayers: { type: integer }
        sources:
          type: array
          items: { $ref: "#/components/schemas/NflAdvancedSource" }
        warnings:
          type: array
          items: { type: string }
        players:
          type: array
          items: { $ref: "#/components/schemas/NflAdvancedPlayer" }
        defense: { $ref: "#/components/schemas/NflAdvancedDefense" }
    NflScheduledGame:
      type: object
      required: [id, awayTeam, homeTeam, date, timeConfirmed, week, seasonType]
      properties:
        id: { type: string }
        awayTeam: { type: string }
        homeTeam: { type: string }
        date: { type: string }
        timeConfirmed: { type: boolean }
        week: { type: integer, minimum: 1, maximum: 22 }
        seasonType: { type: string, enum: [regular, postseason] }
        odds: { $ref: "#/components/schemas/NflMarketQuote" }
    NflMarketQuote:
      type: object
      required: [homeSpread, total, provider]
      properties:
        homeSpread: { type: number }
        total: { type: number }
        provider: { type: string }
    NflSchedule:
      type: object
      required: [season, fetchedAt, sourceUrl, games, unannouncedGames]
      properties:
        season: { type: integer }
        fetchedAt: { type: string }
        sourceUrl: { type: string }
        unannouncedGames: { type: integer }
        games:
          type: array
          items: { $ref: "#/components/schemas/NflScheduledGame" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    NumericStats:
      type: object
      additionalProperties:
        type: number
        minimum: -1000
        maximum: 10000
    RosterPlayer:
      type: object
      required: [id, name, position, side, active]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 100 }
        position: { type: string, enum: [QB, RB, WR, TE, K, OL, DL, EDGE, LB, CB, S, OTHER] }
        side: { type: string, enum: [offense, defense] }
        active: { type: boolean }
        elite1x:
          type: boolean
          description: Legacy elite preference. Used only when eliteTier is omitted; false disables defaults and true enables the approved default tier or 1x.
        eliteTier:
          type: integer
          enum: [0, 1, 2, 3]
          description: Optional manual opportunity tier. 0 disables, 1 gives 20%, 2 gives 40%, and 3 gives 60% higher target/carry priority. QB rushing only. Omitted uses legacy preferences or approved name-and-position defaults.
        defensiveTier:
          type: integer
          enum: [0, 1, 2]
          description: Defensive event priority for defense-side DL/EDGE/LB/CB/S players. 0 disables, 1 adds 20%, 2 adds 40% to role-appropriate opportunity weights. Omitted uses approved defender defaults. Never overrides availability or multiplies fantasy points.
        source: { $ref: "#/components/schemas/NflDataSource" }
        sourcePosition: { type: string }
        availability: { type: string }
        availabilityReport: { $ref: "#/components/schemas/PlayerAvailabilityReport" }
        availabilityOverride: { $ref: "#/components/schemas/PlayerAvailabilityOverride" }
        depthRank: { type: integer, minimum: 1, maximum: 50 }
        depthSource: { $ref: "#/components/schemas/NflDataSource" }
    PlayerAvailabilityReport:
      type: object
      required: [status, rosterActive, source]
      properties:
        status: { type: string, enum: [available, out, questionable, doubtful, limited, unknown] }
        rosterActive: { type: boolean }
        source: { $ref: "#/components/schemas/NflDataSource" }
    PlayerAvailabilityOverride:
      type: object
      required: [week, status, updatedAt]
      properties:
        week: { type: integer, minimum: 1, maximum: 18 }
        status: { type: string, enum: [available, out, questionable, doubtful, limited] }
        updatedAt: { type: string, format: date-time }
    NflDepthRole:
      type: object
      required: [athleteId, position, depthRank]
      properties:
        athleteId: { type: string }
        position: { type: string, enum: [QB, RB, WR, TE] }
        depthRank: { type: integer, minimum: 1, maximum: 50 }
    NflDepthChart:
      type: object
      required: [season, team, source, roles]
      properties:
        season: { type: integer }
        team: { type: string }
        source: { $ref: "#/components/schemas/NflDataSource" }
        roles:
          type: array
          items: { $ref: "#/components/schemas/NflDepthRole" }
    TeamWeek:
      type: object
      required: [week, status, opponent, venue, result, teamScore, opponentScore, teamDefense, playerStats]
      properties:
        week: { type: integer, minimum: 1, maximum: 18 }
        status: { type: string, enum: [played, bye, upcoming] }
        opponent: { type: string, maxLength: 100 }
        venue: { type: string, enum: [home, away] }
        result: { type: string, enum: [W, L, T, none] }
        teamScore: { type: [number, "null"], minimum: 0, maximum: 100 }
        opponentScore: { type: [number, "null"], minimum: 0, maximum: 100 }
        teamDefense: { $ref: "#/components/schemas/NumericStats" }
        playerStats:
          type: object
          additionalProperties: { $ref: "#/components/schemas/NumericStats" }
        source: { $ref: "#/components/schemas/NflDataSource" }
    TeamSeasonInput:
      type: object
      required: [expectedVersion, players, weeks]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        defenseTier:
          type: [integer, "null"]
          enum: [0, 1, null]
          description: Team defensive priority. 0 disables, 1 adds 20%; null uses approved team defaults. An omitted update preserves the saved preference.
        players:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/RosterPlayer" }
        weeks:
          type: array
          maxItems: 18
          items: { $ref: "#/components/schemas/TeamWeek" }
    TeamSeasonRecord:
      type: object
      required: [season, team, version, players, weeks]
      properties:
        season: { type: integer }
        team: { type: string }
        version: { type: integer }
        defenseTier:
          type: [integer, "null"]
          enum: [0, 1, null]
        players:
          type: array
          items: { $ref: "#/components/schemas/RosterPlayer" }
        weeks:
          type: array
          items: { $ref: "#/components/schemas/TeamWeek" }
    SeasonError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    NflDataSource:
      type: object
      required: [provider, url, fetchedAt]
      properties:
        provider: { type: string, enum: [ESPN] }
        url: { type: string, format: uri }
        fetchedAt: { type: string, format: date-time }
        athleteId: { type: string }
        eventId: { type: string }
    NflImportPreview:
      type: object
      required: [season, team, fetchedAt, rosterUrl, players, weeks, warnings]
      properties:
        season: { type: integer }
        team: { type: string }
        fetchedAt: { type: string, format: date-time }
        rosterUrl: { type: string, format: uri }
        players:
          type: array
          items: { $ref: "#/components/schemas/RosterPlayer" }
        weeks:
          type: array
          items: { $ref: "#/components/schemas/TeamWeek" }
        warnings:
          type: array
          items: { type: string }

